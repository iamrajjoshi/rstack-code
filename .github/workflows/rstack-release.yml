# rstack-code: the fork's release. It publishes what the SSH launcher, `t3 update`, and
# scripts/install.sh read: one self-contained CLI archive per platform and SHA256SUMS, under tag
# v<version>, plus, when asked, the macOS desktop app with its update feed (latest-mac.yml).
# GitHub-hosted runners and GITHUB_TOKEN only; the desktop is signed and notarized only when the
# optional Apple secrets exist. See docs/operations/rstack-fork.md.
name: rstack release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v. Empty computes the next fork version.
        required: false
        default: ""
        type: string
      prerelease:
        description: Mark the release as a prerelease, which is never "latest".
        required: false
        default: false
        type: boolean
      desktop:
        description: Also build and attach the macOS arm64 desktop app and its update feed.
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        required: false
        default: ""
        type: string
      prerelease:
        required: false
        default: false
        type: boolean
      desktop:
        required: false
        default: true
        type: boolean
      ref:
        description: Commit to release. A called workflow otherwise builds the caller's github.sha.
        required: false
        default: ""
        type: string
    outputs:
      version:
        value: ${{ jobs.preflight.outputs.version }}

permissions:
  contents: read

concurrency:
  group: rstack-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # Node.js only, for scripts/rstack-version.ts.
      - name: Setup Node.js
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - id: version
        name: Resolve and check version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ -z "$version" ]]; then
            # Upstream's version at this commit plus the next free fork build number.
            version="$(node scripts/rstack-version.ts --remote origin)"
          fi
          # The SSH launcher only accepts one exact SemVer as a runtime directory name.
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::'$version' is not an exact SemVer version."
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release v$version already exists. Delete it or pick another version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  cli_archive:
    name: CLI archive ${{ matrix.resource_key }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          # node-pty compiles from source on Linux and linux-arm64 builds its
          # executable natively, so arm64 builds on arm64 hardware.
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
          - runner: macos-15
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # Installs the pinned Vite+, Node.js (engines.node) and pnpm. Its task
      # cache step only runs in pingdotgg/t3code with a token, so it is skipped.
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # apps/server/dist with the web client in dist/client.
      - name: Build server and web client
        run: vp run --filter t3 build

      - name: Apply web client branding
        shell: bash
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Build resource monitor
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"
          dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" "$dir/"

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      # The Linux archive ships libatomic.so.1 and points t3's RUNPATH at it.
      - name: Install patchelf
        if: matrix.platform == 'linux'
        shell: bash
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf libatomic1; }

      # Without T3CODE_CLI_MAC_SIGN_IDENTITY the macOS archive is signed ad hoc.
      - name: Build CLI archive
        shell: bash
        run: |
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      - name: Upload CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.resource_key }}
          path: release-cli/*
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop macOS arm64
    needs: preflight
    if: inputs.desktop
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      # The app's update feed and release links point at this repository.
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # build-desktop-artifact.ts compiles the resource monitor with cargo.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      # The inputs upstream's release-desktop.yml uses. With all of them the app is signed with
      # Developer ID and notarized with the App Store Connect API key; otherwise it is ad hoc,
      # like `vp run dist:desktop:dmg:arm64`. A missing secret never fails the release.
      - name: Build desktop app
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
        run: |
          set -euo pipefail
          args=(--platform mac --target dmg --arch arm64 --build-version "$VERSION" --output-dir release-desktop --verbose)
          required=(CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID MACOS_PROVISIONING_PROFILE T3CODE_CLERK_PASSKEY_RP_DOMAINS)
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            (umask 077 && printf '%s' "$APPLE_API_KEY" > "$key_path")
            export APPLE_API_KEY="$key_path"
            profile_path="$RUNNER_TEMP/rstack.provisionprofile"
            printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
            security cms -D -i "$profile_path" > /dev/null
            export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
            export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"
            args+=(--signed)
            echo "macOS signing and notarization enabled."
          else
            if [[ ${#missing[@]} -lt ${#required[@]} ]]; then
              echo "::warning::macOS signing is partly configured (missing ${missing[*]}); building ad hoc."
            fi
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            echo "macOS signing disabled; the app is signed ad hoc."
          fi
          node scripts/build-desktop-artifact.ts "${args[@]}"
          ls -la release-desktop

      - name: Upload desktop app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-mac-arm64
          path: |
            release-desktop/*.dmg
            release-desktop/*.zip
            release-desktop/*.blockmap
            release-desktop/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [preflight, cli_archive, desktop]
    # Publishes without the desktop when it was not requested, never after a failed one.
    if: >-
      !cancelled() && needs.cli_archive.result == 'success' &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      SHA: ${{ needs.preflight.outputs.sha }}
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Download desktop app
        if: needs.desktop.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      # Installers and the SSH launcher verify archives against this file.
      - name: Write CLI archive checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          expected=("t3-$VERSION-linux-x64.tar.gz" "t3-$VERSION-linux-arm64.tar.gz" "t3-$VERSION-darwin-arm64.tar.gz")
          for archive in "${expected[@]}"; do
            [[ -f "$archive" ]] || { echo "::error::Missing $archive."; exit 1; }
          done
          sha256sum "${expected[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        shell: bash
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--latest)
          if [[ "$PRERELEASE" == "true" ]]; then flags=(--prerelease --latest=false); fi
          shopt -s nullglob
          # electron-updater reads latest-mac.yml and downloads the zip it names.
          desktop=(*.dmg *.zip *.blockmap latest-mac.yml)
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "v$VERSION" \
            --notes "rstack code v$VERSION, built from $SHA." \
            "${flags[@]}" \
            t3-*.tar.gz SHA256SUMS "${desktop[@]}"
          echo "Published v$VERSION from $SHA with ${#desktop[@]} desktop files." >> "$GITHUB_STEP_SUMMARY"
